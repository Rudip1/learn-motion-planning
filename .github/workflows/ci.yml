name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-notebooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libeigen3-dev

      - name: C++ build and tests
        run: make test

      - name: Python module
        run: python -m pip install -e ".[notebooks]"

      - name: Notebooks are in sync with their sources
        run: python tools/build_notebooks.py --check

      - name: Execute every solution notebook
        run: python tools/execute_notebooks.py --no-write
